

<DOCTYPE html>
    <html>
        <head>
            <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
<style>
    .request {
        font-size: 30px;
        font-weight: 500;
        font-family: Montserrat;
    }
    .location,.destination {
        display: block;
        margin-bottom: 6px;
        border: none;
        background-color: rgb(239, 239, 239);
        padding: 15px 100px;
        border-radius: 5px;
        text-align: left;
        color: rgb(175, 175, 175);
    }
    .now {
        margin-top: 25px;
        margin-right: 12px;
        padding: 10px 18px;
        background-color: black;
        color: aliceblue;
    }
    
    .now,.schedule:hover {
        cursor: pointer;
    }

    .schedule {
        padding: 10px 18px;
        border: none;
    }
    
</style>
            <title> Uberr.com </title>
        </head>
    <body>
        <p class="request"> Request a ride now </p> 
    <input class="location" type="text" placeholder="Enter pickup location">
    <input class="destination" type="text" placeholder="Enter destination">
    <button class="now"> Request now </button>
    <button class="schedule"> Schedule for later </button>
</body>
    </html>
